<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCore PWA - Ruang Belajar</title>
  
  <!-- PWA & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e15">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Canvas Background Neon (Latar Paling Belakang) -->
  <canvas id="neonCanvas"></canvas>

  <!-- Workspace Utama Application Shell -->
  <main class="app-workspace">

    <!-- Navigasai -->
    <section class="HeaderNav">
      <!-- Header Aplikasi -->
      <header class="cyber-header">
        <div class="brand-title">
          <h2 class="neon-tile">RUANG BELAJAR</h2>
          <p class="neon-subtitle">Sektor Siber v1.0 // <b><i>PWA CORE Tuan Penulis</i></b></p>
        </div>
        <div class="header-nav-debug"></div>
      </header>
    </section>

    <!-- Area Utama Kiri (75% Desktop) -->
    <section class="main-content-area">
      <div id="logOutput" class="log-content"></div>
    </section>

    <!-- Panel HUD Sidebar Kanan (25% Desktop) -->
    <aside class="hud-sidebar">
    </aside>
  </main>

  <!-- Eruda Mobile Console & Network Inspector -->
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
    
  <!-- Script Modular (ES Module) -->
  <script type="module" src="./js/app.js"></script>
  <script>
    // Helper untuk menumpuk log (tidak menimpa teks sebelumnya)
    function debugLog(message) {
      const headerNav = document.querySelector('.header-nav-debug') || document.querySelector('header');
      if (headerNav) {
        // Menggunakan += agar log menumpuk secara berurutan
        headerNav.innerHTML += `<div style="font-size: 11px; color: #ff5555;">> ${message}</div>`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      debugLog('1. Check import: ' + typeof renderFormRegistrasi);

      try {
        const mainContent = document.querySelector('.main-content-area');
        
        debugLog('2. Memanggil renderFormRegistrasi()...');
        const htmlForm = renderFormRegistrasi(); 
        debugLog('3. Form HTML berhasil dibuat!');

        if (mainContent) {
          mainContent.innerHTML = htmlForm;
          debugLog('4. Injeksi HTML sukses!');
        }
      } catch (err) {
        // Menampilkan pesan error LENGKAP beserta baris penyebabnya (stack trace)
        debugLog(`CRITICAL ERROR: ${err.message}`);
        if (err.stack) {
          // Mengambil baris pertama dari stack trace
          const stackLine = err.stack.split('\n')[1] || '';
          debugLog(`AT: ${stackLine.trim()}`);
        }
      }
    });
  </script>
</body>
</html>
