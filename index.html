<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCore PWA - Ruang Belajar</title>
  
  <!-- PWA & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e15">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Canvas Background Neon (Latar Paling Belakang) -->
  <canvas id="neonCanvas"></canvas>

  <!-- Workspace Utama Application Shell -->
  <main class="app-workspace">

    <!-- Navigasai -->
    <section class="HeaderNav">
      <!-- Header Aplikasi -->
      <header class="cyber-header">
        <div class="brand-title">
          <h2 class="neon-tile">RUANG BELAJAR</h2>
          <p class="neon-subtitle">Sektor Siber v1.0 // <b><i>PWA CORE Tuan Penulis</i></b></p>
        </div>
        <div class="header-nav-debug"></div>
      </header>
    </section>

    <!-- Area Utama Kiri (75% Desktop) -->
    <section class="main-content-area">
      <div id="logOutput" class="log-content"></div>
    </section>

    <!-- Panel HUD Sidebar Kanan (25% Desktop) -->
    <aside class="hud-sidebar">
    </aside>
  </main>

  <!-- Script Modular (ES Module) -->
  <script type="module" src="js/app.js"></script>
  <script>
    // Helper untuk menulis log langsung ke UI Header
    function debugLog(message) {
      const headerNav = document.querySelector('.header-nav-debug') || document.querySelector('header');
      if (headerNav) {
        headerNav.innerText = `[SYS_LOG]: ${message}`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      debugLog('1. DOM Ready, initializing imports...');
      debugLog(`Type of renderForm: ${typeof renderFormRegistrasi}`);

      try {
        const mainContent = document.querySelector('.main-content-area');
        const hudSidebar = document.querySelector('.hud-sidebar');
        
        debugLog('2. Target selectors found. Rendering components...');

        if (mainContent) {
          mainContent.innerHTML = renderFormRegistrasi() + renderDataSiswaTable();
        }
        if (hudSidebar) {
          hudSidebar.innerHTML = renderLogPanel();
        }

        debugLog('3. Render complete! Initializing handlers...');
        
        initFormRegistrasiHandler();
        debugLog('4. System fully online.');

      } catch (err) {
        // Menangkap runtime error dan menampilkan pesan error langsung ke header
        debugLog(`ERROR: ${err.message}`);
      }
    });
  </script>
</body>
</html>
