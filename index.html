<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCore PWA</title>
  
  <!-- PWA & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e15">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Canvas Background Neon (Wajib Ada) -->
  <canvas id="neonCanvas"></canvas>
    <div class="cyber-header">
      <h1 class="neon-title" data-text="CYBER//CORE">CYBER//CORE - GAS TEST</h1>
      <p class="neon-subtitle">SYSTEM STATUS: <span id="sys-status">ONLINE</span></p>
    </div>

    <!-- Canvas untuk Efek Animasi Neon Grid/Garis -->
    <div class="canvas-wrapper">
      <canvas id="neonCanvas"></canvas>
    </div>
  </canvas>
  
  <main class="app-workspace">
    <!-- Area Utama Kiri (75%) -->
    <section class="main-content-area">
      <div class="form-card-floating">
        <h3>// REGISTRASI USER</h3>
        <form id="userForm" class="user-form">
          <div class="form-group">
            <label for="inputNama">NAMA LENGKAP</label>
            <input type="text" id="inputNama" placeholder="Contoh: Penulis Eksentrik" required />
          </div>
          
          <div class="form-group">
            <label for="inputEmail">ALAMAT EMAIL</label>
            <input type="email" id="inputEmail" placeholder="nama@email.com" required />
          </div>
          
          <div class="form-group">
            <label for="selectRole">PERAN (ROLE)</label>
            <select id="selectRole">
              <option value="Siswa">Siswa</option>
              <option value="Pengajar">Pengajar</option>
            </select>
          </div>

          <button type="submit" id="btnSubmit" class="btn-primary">KIRIM DATA USER</button>
        </form>
      </div>
    </section>

    <!-- Panel HUD Kanan (25%) -->
    <aside class="hud-sidebar">
      <div class="hud-header">
        <h4>RUANG BELAJAR</h4>
        <p class="status-indicator">⚡ SYSTEM ONLINE</p>
        <button id="btnFetch" class="btn-secondary-sm">TES SINYAL (GET)</button>
      </div>
      
      <hr class="hud-divider" />

      <div class="hud-terminal">
        <small>// TERMINAL LOGS</small>
        <div id="logOutput" class="log-content">
          > Sistem siap. Menunggu aksi...
        </div>
      </div>
    </aside>
  </main>

  <!-- Script Modular (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
