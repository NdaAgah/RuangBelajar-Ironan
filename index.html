<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberCore PWA</title>
  
  <!-- PWA & Theme -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d0e15">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Futuristic Cyber Container -->
  <main class="cyber-shell">
    <div class="cyber-header">
      <h1 class="neon-title" data-text="CYBER//CORE">CYBER//CORE - GAS TEST</h1>
      <p class="neon-subtitle">SYSTEM STATUS: <span id="sys-status">ONLINE</span></p>
    </div>

    <!-- Canvas untuk Efek Animasi Neon Grid/Garis -->
    <div class="canvas-wrapper">
      <canvas id="neonCanvas"></canvas>
    </div>

    <!-- Form User Sederhana -->
    <div class="user-form-container">
      <h3>REGISTER USER BARU</h3>
      <form id="userForm">
        <input type="text" id="inputNama" placeholder="Nama Lengkap" required />
        <input type="email" id="inputEmail" placeholder="Alamat Email" required />
        <select id="selectRole">
          <option value="Siswa">Siswa</option>
          <option value="Pengajar">Pengajar</option>
        </select>
        <button type="submit" id="btnSubmit">KIRIM DATA USER</button>
      </form>
      <div id="formStatus"></div>
    </div>

    <!-- Kartu Status Log Eksekusi -->
    <div class="log-card">
      <h4>CONSOLE LOG EKSEKUSI</h4>
      <div id="logOutput" class="log-content">
        > Sistem siap. Menunggu entri data...
      </div>
    </div>
    
    <!-- UI Panel Futuristis -->
    <section class="cyber-panel">
      <div class="panel-border"></div>
      <h2>CONTROL PANEL</h2>
      <button id="btnFetch" class="cyber-btn">INISIASI KONEKSI API</button>
      <div id="dataOutput" class="cyber-output">> Menunggu sinyal...</div>
    </section>
  </main>

  <!-- Script Modular (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
