<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ironan CyberGate | S.I.B.E.R. EduSiber Verifier</title>
    <link rel="stylesheet" href="./css/usrrobotica.css">
</head>
<body>
    <canvas id="neuralPositronic"></canvas>

    <!-- 1. HEADER -->
    <header class="usr-header">
        <div class="usr-brand">
            <span>IRONAN CYBERGATE v1.0</span>
            <span class="usr-brand-badge">[S.I.B.E.R. Engine // EduSiber Verifier Module]</span>
        </div>
        <nav class="usr-nav" id="usrNav">
            <!-- Navigasi Modul Diisi Secara Dinamis -->
        </nav>
        <div class="usr-status">
            <div class="usr-status-dot"></div>
            <span>SYSTEM ONLINE</span>
        </div>
    </header>

    <!-- 2. RUANG KERJA UTAMA -->
    <main class="usr-workspace" id="usrWorkspace">
        <!-- Konten Modul Aktif Ditampilkan Di Sini -->
    </main>

    <!-- 3. LOG PANEL -->
    <footer class="usr-log-panel" id="usrLogPanel">
        <div class="usr-log-header" id="usrLogHeader">
            <div class="usr-log-title">
                <span class="usr-log-toggle-icon">🔻</span>
                <span>System Telemetry & Audit Logs</span>
            </div>
            <span id="logCount">Logs: 0</span>
        </div>
        <div class="usr-log-content" id="usrLogStream"></div>
    </footer>

    <!-- 4. DYNAMIC MODAL CONTAINER -->
    <div class="usr-modal-overlay" id="usrModalOverlay">
        <div class="usr-modal-card">
            <div class="usr-modal-header">
                <h3 class="usr-modal-title" id="usrModalTitle">System Dialog</h3>
                <button class="usr-modal-close" id="usrModalClose">&times;</button>
            </div>
            <div class="usr-modal-body" id="usrModalBody">
                <!-- Form Dinamis Akan Diresapi Di Sini -->
            </div>
        </div>
    </div>


    <!-- Eruda Mobile Console & Network Inspector -->
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
        eruda.init();
    </script>

    <!-- MODULAR SYSTEM ARCHITECTURE SCRIPT -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
